[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",        # no VCRUNTIME140.dll dependency
    "-C", "control-flow-guard",                # CFG: checked indirect calls
    "-C", "link-arg=/DEPENDENTLOADFLAG:0x800", # static imports load from System32 only (DLL planting)
]
